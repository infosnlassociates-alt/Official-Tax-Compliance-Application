name: Build Android APK from Vite Project

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Vite Web Project
      run: npm run build

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK Licenses (Fix License Error)
      run: |
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Initialize Capacitor Android
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev
        npx cap init "Tax App" "com.taxcompliance.app" --web-dir=dist --confirm
        npx cap add android

    - name: Sync Web Code to Android
      run: npx cap sync android

    - name: Build Debug APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Test APK
      uses: actions/upload-artifact@v4
      with:
        name: official-tax-app-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
