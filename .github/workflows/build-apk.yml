name: Build Android APK from Vite Project

on:
  push:
    branches:
      - main  # अगर आपकी मुख्य ब्रांच का नाम master है, तो यहाँ master लिखें

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js (Latest Stable)
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Vite Web Project
      run: npm run build

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK & Automatically Accept Licenses
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools build-tools;34.0.0' # 2026 के अनुसार लेटेस्ट बिल्ड टूल्स और प्लेटफॉर्म टूल्स
        # यह प्लगइन अब बैकग्राउंड में ऑटोमैटिकली सभी लाइसेंस को 'YES' कर देता है

    - name: Initialize Capacitor Android
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev
        npx cap init "Tax App" "com.taxcompliance.app" --web-dir=dist --confirm
        npx cap add android

    - name: Sync Web Code to Android
      run: npx cap sync android

    - name: Build Debug APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Test APK
      uses: actions/upload-artifact@v4
      with:
        name: official-tax-app-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
