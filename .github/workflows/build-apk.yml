name: Build Android APK from Vite Project

on:
  push:
    branches:
      - main  # यदि रिपॉजिटरी में 'master' है, तो इसे master कर दें

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Vite Project
      run: npm run build

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Pre-build Android Wrapper (Fix missing directory error)
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev
        npx cap init "Tax App" "com.taxcompliance.app" --web-dir=dist --confirm || true
        
        # यदि रिपॉजिटरी में पहले से android फोल्डर नहीं है, तो उसे फ्रेश जनरेट करें
        if [ ! -d "android" ]; then
          npx cap add android
        fi

    - name: Sync Web Files to Android Folder
      run: npx cap sync android

    - name: Set Android Permissions & Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: official-tax-app-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
