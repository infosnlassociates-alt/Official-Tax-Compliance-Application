name: Build Android APK from Vite Project

on:
  push:
    branches:
      - main  # अगर आपकी मुख्य ब्रांच का नाम master है, तो यहाँ master लिखें

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Vite Project
      run: npm run build

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    - name: Force Initialize Capacitor Configuration & Platform
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev
        
        # अगर कॉन्फ़िगरेशन फ़ाइल नहीं है, तो एक बेसिक JSON फ़ाइल खुद बनाएं
        if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
          echo '{"appId": "com.taxcompliance.app", "appName": "Tax App", "webDir": "dist"}' > capacitor.config.json
        fi
        
        # यदि रिपॉजिटरी में पहले से android फ़ोल्डर नहीं है, तो उसे फ्रेश जनरेट करें
        if [ ! -d "android" ]; then
          npx cap add android
        fi

    - name: Sync Web Files to Android Folder
      run: npx cap sync android

    - name: Build Debug APK with Gradle Wrapper
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: official-tax-app-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
